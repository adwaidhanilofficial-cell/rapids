<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Razorpay Subscription Checkout</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f7fafc; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; max-width: 400px; }
        button { background-color: #1a202c; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 4px; cursor: pointer; transition: background-color 0.2s; }
        button:hover { background-color: #2d3748; }
        button:disabled { background-color: #a0aec0; cursor: not-allowed; }
        .message { margin-top: 1rem; color: #4a5568; font-size: 14px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Pro Membership</h2>
    <p>Pay ₹5 upfront setup fee now. After 30 days, AutoPay of ₹10/month begins.</p>
    <button id="rzp-button1">Subscribe Now</button>
    <div id="status-message" class="message"></div>
</div>

<!-- Load Razorpay Checkout Script -->
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
    document.getElementById('rzp-button1').onclick = async function (e) {
        const button = e.target;
        const statusMessage = document.getElementById('status-message');
        
        button.disabled = true;
        button.innerText = 'Initializing...';
        statusMessage.innerText = '';

        try {
            // 1. Ask our backend to create a subscription order
            const response = await fetch('/api/create-subscription', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            });

            const data = await response.json();

            if (!response.ok || !data.subscription_id) {
                throw new Error(data.error || 'Failed to create subscription.');
            }

            // Replace YOUR_KEY_ID with the key exposed to the frontend (e.g. env var)
            // Note: Since this is an HTML file, hardcode your test Key ID below or load dynamically.
            const RAZORPAY_KEY_ID = 'YOUR_KEY_ID'; 

            // 2. Setup options for Razorpay Checkout
            // DO NOT use "amount" or "order_id" for subscriptions. Just use "subscription_id".
            const options = {
                "key": RAZORPAY_KEY_ID, 
                "subscription_id": data.subscription_id,
                "name": "Rapids Training",
                "description": "Pro Membership AutoPay",
                "currency": "INR",
                "handler": function (response) {
                    // 3. Handle successful authorisation
                    // Here you usually send these details to your backend to verify the signature
                    // and then update the user state in your database/n8n.
                    const paymentId = response.razorpay_payment_id;
                    const subscriptionId = response.razorpay_subscription_id;
                    const signature = response.razorpay_signature;

                    statusMessage.style.color = 'green';
                    statusMessage.innerText = `Success! Payment ID: ${paymentId}. Subscription active.`;
                    
                    // console.log("Success Response:", response);
                    // You can POST these details to your webhook endpoint to cross-verify.
                },
                "prefill": {
                    "name": "John Doe",
                    "email": "john.doe@example.com",
                    "contact": "9999999999"
                },
                "theme": {
                    "color": "#1a202c"
                }
            };

            // 4. Open Razorpay Checkout modal
            const rzp1 = new Razorpay(options);
            
            rzp1.on('payment.failed', function (response){
                statusMessage.style.color = 'red';
                statusMessage.innerText = `Payment Failed: ${response.error.description}`;
            });

            rzp1.open();

        } catch (error) {
            statusMessage.style.color = 'red';
            statusMessage.innerText = `Error: ${error.message}`;
        } finally {
            button.disabled = false;
            button.innerText = 'Subscribe Now';
            e.preventDefault();
        }
    };
</script>
</body>
</html>
