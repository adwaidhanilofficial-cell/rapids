<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Rapids</title>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <meta name="description"
    content="Premium offline classroom training for executive communication, trading, and e-commerce in Kunnamkulam, Kerala. Join the elite." />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://rapids-lxp.com/" />
  <meta property="og:title" content="Rapids LXP | Forging Elites" />
  <meta property="og:description"
    content="Master public speaking and corporate leadership. The only offline training center dedicated to high-performance skills in Kerala." />
  <meta property="og:image"
    content="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?q=80&w=1200&auto=format&fit=crop" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://rapids-lxp.com/" />
  <meta property="twitter:title" content="Rapids LXP | Executive Training" />
  <meta property="twitter:description" content="Forging Elites. Master the art of communication and leadership." />
  <meta property="twitter:image"
    content="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?q=80&w=1200&auto=format&fit=crop" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>

  <!-- Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&family=Inter:wght@200;300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Manjari:wght@100;400;700&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined|Material+Icons+Round" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    rel="stylesheet" />

  <!-- Tailwind Config -->
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#D4AF37",
            "primary-dark": "#AA8C2C",
            "background-dark": "#050505", // Slightly softer than pure black for depth
            "background-light": "#F3F4F6",
            "surface-dark": "#0A0A0A",
            "surface-dark-2": "#111111",
            "surface-light": "#FFFFFF",
            "gold-light": "#F9E4B7",
          },
          fontFamily: {
            serif: ["Cinzel", "serif"],
            sans: ["Inter", "sans-serif"],
            display: ["Playfair Display", "serif"],
            malayalam: ["Manjari", "sans-serif"],
          },
          backgroundImage: {
            'gold-platinum': 'linear-gradient(to right, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C)',
            'gold-platinum-vertical': 'linear-gradient(to bottom, #BF953F, #FCF6BA, #B38728)',
            'dark-gradient': 'linear-gradient(to bottom, rgba(0,0,0,0) 0%, #020202 100%)',
            'glass': 'linear-gradient(145deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.01) 100%)',
          },
          animation: {
            'shine': 'shine 4s linear infinite',
            'scroll-up': 'scrollUp 40s linear infinite',
            'pulse-gold': 'pulseGold 3s infinite',
            'float': 'float 6s ease-in-out infinite',
          },
          keyframes: {
            shine: {
              '0%': { backgroundPosition: '200% center' },
              '100%': { backgroundPosition: '-200% center' },
            },
            scrollUp: {
              '0%': { transform: 'translateY(0)' },
              '100%': { transform: 'translateY(-50%)' },
            },
            pulseGold: {
              '0%, 100%': { boxShadow: '0 0 0 0 rgba(212, 175, 55, 0)' },
              '50%': { boxShadow: '0 0 20px 0 rgba(212, 175, 55, 0.3)' },
            },
            float: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-20px)' },
            }
          },
          letterSpacing: {
            'ultra-wide': '0.25em',
          }
        },
      },
    };
  </script>
  <style>
    body {
      background-color: #050505;
      color: #E5E7EB;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      transition: background-color 0.5s cubic-bezier(0.4, 0, 0.2, 1), color 0.5s ease;
    }

    html:not(.dark) body {
      background-color: #F3F4F6;
      color: #111827;
    }

    /* Premium Text Gradient */
    .text-platinum {
      background: linear-gradient(to right, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shine 6s linear infinite;
      text-shadow: 0px 0px 30px rgba(191, 149, 63, 0.2);
    }

    /* Refined Noise */
    .noise-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 50;
      opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }

    /* Subtle Geomtric Pattern */
    .geo-bg {
      background-color: #050505;
      background-image: radial-gradient(#151515 1px, transparent 1px);
      background-size: 40px 40px;
    }

    /* Premium Card Glass */
    .glass-card {
      background: rgba(20, 20, 20, 0.4);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "framer-motion": "https://esm.sh/framer-motion@^12.29.2",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.3"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
